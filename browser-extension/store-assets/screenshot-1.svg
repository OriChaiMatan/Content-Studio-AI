<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" width="1280" height="1280" font-family="-apple-system,'Helvetica Neue','Segoe UI',Arial,sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9F1FC"/>
  </linearGradient></defs>
  <rect width="1280" height="1280" fill="#FFFFFF"/>
  <g transform="translate(0,240)">
  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1170" cy="700" r="280" fill="#094CB2" opacity="0.04"/>
  <circle cx="90" cy="40" r="170" fill="#094CB2" opacity="0.035"/>

  <!-- Left: brand + copy -->
  <g transform="translate(80,70) scale(0.359375)">
    <rect width="128" height="128" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>
    <path d="M24 36V104H92" stroke="#094CB2" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 10L99 27L112 34L99 41L92 58L85 41L72 34L85 27Z" fill="#094CB2"/>
  </g>
  <text x="140" y="103" font-size="29" font-weight="700" fill="#094CB2">LumAI</text>

  <text x="80" y="300" font-size="54" font-weight="800" fill="#0F172A">
    <tspan x="80" dy="0">Save sources to LumAI</tspan>
    <tspan x="80" dy="64">in one click</tspan>
  </text>

  <text x="80" y="450" font-size="21" fill="#64748B">
    <tspan x="80" dy="0">Capture the current page URL and title, then save</tspan>
    <tspan x="80" dy="30">it directly into a LumAI content case.</tspan>
  </text>

  <!-- trust pill -->
  <rect x="80" y="520" width="312" height="40" rx="20" fill="#EFF4FC"/>
  <circle cx="104" cy="540" r="9" fill="#094CB2"/>
  <path d="M100 540 l3 3 l5 -6" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="545" font-size="14" font-weight="600" fill="#094CB2">Saves the page URL + title only</text>

  <!-- Browser window shadow + frame -->
  <rect x="696" y="136" width="510" height="540" rx="16" fill="#0F172A" opacity="0.10"/>
  <rect x="690" y="120" width="510" height="540" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <path d="M706,120 h478 a16,16 0 0 1 16,16 v32 h-510 v-32 a16,16 0 0 1 16,-16 z" fill="#F8FAFC"/>
  <line x1="690" y1="168" x2="1200" y2="168" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="714" cy="144" r="6" fill="#FF5F57"/>
  <circle cx="734" cy="144" r="6" fill="#FEBC2E"/>
  <circle cx="754" cy="144" r="6" fill="#28C840"/>
  <!-- address bar -->
  <rect x="786" y="132" width="300" height="24" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="802" cy="144" r="4" fill="#94A3B8"/>
  <text x="816" y="148" font-size="12" fill="#64748B">example.com/blog/marketing-trends</text>
  <!-- highlighted extension icon -->
  <rect x="1136" y="130" width="30" height="28" rx="8" fill="#EFF4FC"/>
  <g transform="translate(1140,134) scale(0.171875)">
    <path d="M24 36V104H92" stroke="#094CB2" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 10L99 27L112 34L99 41L92 58L85 41L72 34L85 27Z" fill="#094CB2"/>
  </g>

  <!-- faint article content -->
  <rect x="726" y="204" width="300" height="22" rx="6" fill="#E2E8F0"/>
  <rect x="726" y="240" width="190" height="14" rx="6" fill="#EEF2F7"/>
  <rect x="726" y="276" width="438" height="130" rx="10" fill="#F1F5F9"/>
  <circle cx="780" cy="365" r="14" fill="#E2E8F0"/>
  <path d="M810 388 l40 -46 l34 40 l24 -22 l44 28" stroke="#E2E8F0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="726" y="432" width="420" height="11" rx="5" fill="#EEF2F7"/><rect x="726" y="456" width="400" height="11" rx="5" fill="#EEF2F7"/><rect x="726" y="480" width="430" height="11" rx="5" fill="#EEF2F7"/><rect x="726" y="504" width="300" height="11" rx="5" fill="#EEF2F7"/>

  <!-- Popup card (floating) -->
  <rect x="840" y="180" width="336" height="414" rx="18" fill="#0F172A" opacity="0.14"/>
  <rect x="840" y="168" width="336" height="414" rx="18" fill="#FFFFFF" stroke="#E7EAF0" stroke-width="1.5"/>

  <!-- popup header -->
  <g transform="translate(862,188) scale(0.203125)">
    <rect width="128" height="128" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>
    <path d="M24 36V104H92" stroke="#094CB2" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M92 10L99 27L112 34L99 41L92 58L85 41L72 34L85 27Z" fill="#094CB2"/>
  </g>
  <text x="898" y="207" font-size="15" font-weight="700" fill="#0F172A">LumAI</text>
  <circle cx="1142" cy="201" r="10" fill="none" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="1142" cy="201" r="3" fill="#94A3B8"/>
  <line x1="862" y1="230" x2="1154" y2="230" stroke="#E5E7EB"/>

  <text x="862" y="260" font-size="16" font-weight="700" fill="#0F172A">Save source to LumAI</text>
  <text x="862" y="282" font-size="13" fill="#64748B">Add this page to one of your content cases.</text>

  
    <text x="862" y="320" font-size="11" font-weight="700" letter-spacing="0.8" fill="#94A3B8">TITLE</text>
    
    <rect x="862" y="328" width="292" height="38" rx="10" fill="#F8FAFC" stroke="#E5E7EB"/>
    <text x="876" y="352" font-size="13" fill="#0F172A">AI marketing trends for 2026</text>

  
    <text x="862" y="380" font-size="11" font-weight="700" letter-spacing="0.8" fill="#94A3B8">URL</text>
    
    <rect x="862" y="388" width="292" height="38" rx="10" fill="#F8FAFC" stroke="#E5E7EB"/>
    <text x="876" y="412" font-size="13" fill="#094CB2">example.com/blog/marketing-trends</text>

  
    <text x="862" y="440" font-size="11" font-weight="700" letter-spacing="0.8" fill="#94A3B8">CASE</text>
    
    <rect x="862" y="448" width="292" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
    <path d="M876 463 h10 l3 4 h13 v11 h-26 z" fill="none" stroke="#094CB2" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="906" y="473" font-size="13" fill="#0F172A">Marketing Q3 Campaign</text>
    <path d="M1128 465 l6 6 l6 -6" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- save button -->
  <rect x="862" y="506" width="292" height="44" rx="12" fill="#094CB2"/>
  <path d="M952 520 v14 l5 -4 l5 4 v-14 z" fill="#FFFFFF" opacity="0.95"/>
  <text x="1014" y="534" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save source</text>

  <circle cx="867" cy="570" r="4" fill="#16A34A"/>
  <text x="880" y="575" font-size="12" fill="#64748B">Connected to LumAI</text>
  </g>
</svg>